name: Publish Docker image

on:
  push:
    branches: [ 'main' ]
  release:
    types: [ 'published' ]
  # Rebuild monthly so the published image keeps a fresh base layer. The
  # self-signed certificate itself is valid for 100 years (CERT_VALIDITY_DAYS in
  # the Dockerfile), so this is no longer what keeps it from expiring.
  schedule:
    - cron: '0 3 1 * *'
  workflow_dispatch:

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ github.repository }}
  DOCKER_NAME: ${{ vars.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}

jobs:
  build-certgen-image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - amd64
          - arm64
    permissions:
      contents: read
      packages: write

    steps:
      - name: Prepare
        run: |
          platform=linux/${{ matrix.platform }}
          echo "PLATFORM_PAIR_CERTGEN=${platform//\//-}" >> $GITHUB_ENV
      - name: Checkout repository
        uses: actions/checkout@v2

        # Add support for more platforms with QEMU (optional)
        # https://github.com/docker/setup-qemu-action
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_NAME }}
          # Branch name (e.g. `main`) and release tags only. Listed explicitly so
          # the scheduled rebuild also publishes `main` (default tag rules would
          # add a `nightly` tag for schedule events).
          tags: |
            type=ref,event=branch
            type=ref,event=tag

      - name: Build Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/${{ matrix.platform }}
          # push: true
          # tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Unique per run: forces the cert-generation layers in the Dockerfile
          # to be rebuilt rather than restored from the registry build cache.
          build-args: |
            CACHEBUST=${{ github.run_id }}
          cache-from: type=registry,ref=${{ env.DOCKER_NAME }}:${{ matrix.platform }}-buildcache
          cache-to: type=registry,ref=${{ env.DOCKER_NAME }}:${{ matrix.platform }}-buildcache,mode=max
          outputs: type=image,name=${{ env.DOCKER_NAME }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests/certgen
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/certgen/${digest#sha256:}"
      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR_CERTGEN }}
          path: /tmp/digests/certgen/*
          if-no-files-found: error
          retention-days: 1    

  merge-certgen-platform-images:
    runs-on: ubuntu-latest
    needs:
      - build-certgen-image
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests/certgen
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_NAME }}
          # Branch name (e.g. `main`) and release tags only. Listed explicitly so
          # the scheduled rebuild also publishes `main` (default tag rules would
          # add a `nightly` tag for schedule events).
          tags: |
            type=ref,event=branch
            type=ref,event=tag

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests/certgen
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.DOCKER_NAME }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.DOCKER_NAME }}:${{ steps.meta.outputs.version }}
        
